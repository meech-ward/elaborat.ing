name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The build generates src/routeTree.gen.ts, which typecheck and lint need.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
