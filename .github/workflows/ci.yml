name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The build generates src/routeTree.gen.ts, which typecheck and lint need.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  # Migrations are generated from supabase/schemas/ and committed. Regenerate
  # them and fail if that writes anything, so the two never drift apart.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      # Builds shadow databases in Docker, which the runner provides.
      - run: supabase db schema declarative sync --no-apply --strict-coverage --agent no
      - name: Check that supabase/migrations/ is up to date
        run: |
          changes="$(git status --porcelain -- supabase/migrations)"
          if [ -n "$changes" ]; then
            echo "::error::supabase/migrations/ is out of date with supabase/schemas/. Run 'bunx supabase@2.118.0 db schema declarative sync' and commit the migration it writes."
            echo "$changes"
            git diff -- supabase/migrations
            git ls-files --others --exclude-standard -- supabase/migrations | xargs -r cat
            exit 1
          fi
