name: CI

# Pushes to any branch in this repository run the checks too, so a branch is
# checked before it has a pull request.
on:
  pull_request:
  push:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The build generates src/routeTree.gen.ts, which typecheck and lint need.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # The chat card's editor script is built from the app's editor and
      # committed, because the functions deploy without building the app.
      - name: Check that the chat card's editor script is up to date
        run: |
          bun run build:chat-card
          if ! git diff --quiet -- supabase/functions/mcp-server/tools/cardEditorScript.ts; then
            echo "::error::supabase/functions/mcp-server/tools/cardEditorScript.ts is out of date. Run 'bun run build:chat-card' and commit it."
            exit 1
          fi

  # Browser tests run the production builds in Chromium and Firefox.
  # Playwright runs on Node; Bun installs and builds.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The app built against a stand-in Supabase URL the tests answer themselves.
      - run: bun run build:browser-test
      - run: bun run build:harness
      # The app's next version, for the update journey in offline.spec.ts.
      - run: bun run build:next-version
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # Migrations are generated from supabase/schemas/ and committed. Regenerate
  # them and fail if that writes anything, so the two never drift apart.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      # Builds shadow databases in Docker, which the runner provides.
      - run: supabase db schema declarative sync --no-apply --strict-coverage --agent no
      - name: Check that supabase/migrations/ is up to date
        run: |
          changes="$(git status --porcelain -- supabase/migrations)"
          if [ -n "$changes" ]; then
            echo "::error::supabase/migrations/ is out of date with supabase/schemas/. Run 'bunx supabase@2.118.0 db schema declarative sync' and commit the migration it writes."
            echo "$changes"
            git diff -- supabase/migrations
            git ls-files --others --exclude-standard -- supabase/migrations | xargs -r cat
            exit 1
          fi

  # Edge Functions run on Deno. Each has its own deno.json and deno.lock, and
  # --frozen fails rather than update a lockfile that is out of date.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check and test every function
        run: |
          for function in supabase/functions/*/; do
            echo "::group::$function"
            (cd "$function" && deno check --frozen . && deno test --frozen --permit-no-files)
            echo "::endgroup::"
          done
