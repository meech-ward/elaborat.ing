name: CI

# Pushes to any branch in this repository run the checks too, so a branch is
# checked before it has a pull request.
on:
  pull_request:
  push:

# A newer push to a branch cancels the older run there. On main every run
# finishes, because the app deploys only after a run on main passes.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The build generates src/routeTree.gen.ts, which typecheck and lint need.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      # The chat card is built from the app's components and committed: the
      # view's script, because the functions deploy without building the app,
      # and the modules it loads from the site, which every app deploy serves.
      - name: Check that the chat card is up to date
        run: |
          bun run build:chat-card
          changes="$(git status --porcelain -- supabase/functions/mcp-server/tools/cardEditorScript.ts public/chat-card)"
          if [ -n "$changes" ]; then
            echo "::error::The chat card is out of date. Run 'bun run build:chat-card' and commit cardEditorScript.ts and public/chat-card."
            echo "$changes"
            exit 1
          fi
      # The loading rule (docs/architecture.md, Principles): each page's first
      # paint and the chat card's view within its budget in
      # scripts/bundle-budget.json, and no heavy library before a first paint.
      # The visualize build writes the chunk graph and module map it reads.
      - run: bun run build:visualize
      - run: bun run check:bundle

  # Browser tests run the production builds in Chromium and Firefox.
  # Playwright runs on Node; Bun installs and builds. Each browser's tests are
  # split across two jobs that run in parallel. Each job builds the bundles
  # itself: the builds take under a minute, and one build job handing them on
  # would only add its own run and the transfer before any test starts.
  browser-shard:
    name: browser (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs to the end, so one run reports every failure.
      fail-fast: false
      matrix:
        project: [chromium, firefox]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # The app built against a stand-in Supabase URL the tests answer themselves.
      - run: bun run build:browser-test
      - run: bun run build:harness
      # The app's next version, for the update journey in offline.spec.ts.
      - run: bun run build:next-version
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # One result for the browser tests, passing only when every shard passed.
  browser:
    needs: browser-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.browser-shard.result }}" = success

  # Migrations are generated from supabase/schemas/ and committed. Regenerate
  # them and fail if that writes anything, so the two never drift apart.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v3
        with:
          version: 2.118.0
      # Builds shadow databases in Docker, which the runner provides.
      - run: supabase db schema declarative sync --no-apply --strict-coverage --agent no
      - name: Check that supabase/migrations/ is up to date
        run: |
          changes="$(git status --porcelain -- supabase/migrations)"
          if [ -n "$changes" ]; then
            echo "::error::supabase/migrations/ is out of date with supabase/schemas/. Run 'bunx supabase@2.118.0 db schema declarative sync' and commit the migration it writes."
            echo "$changes"
            git diff -- supabase/migrations
            git ls-files --others --exclude-standard -- supabase/migrations | xargs -r cat
            exit 1
          fi

  # Edge Functions run on Deno. Each has its own deno.json and deno.lock, and
  # --frozen fails rather than update a lockfile that is out of date.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check and test every function
        run: |
          for function in supabase/functions/*/; do
            echo "::group::$function"
            (cd "$function" && deno check --frozen . && deno test --frozen --permit-no-files)
            echo "::endgroup::"
          done
