name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The build generates src/routeTree.gen.ts, which typecheck and lint need.
      - run: bun run build
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  # Edge Functions run on Deno. Each has its own deno.json and deno.lock, and
  # --frozen fails rather than update a lockfile that is out of date.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check and test every function
        run: |
          for function in supabase/functions/*/; do
            echo "::group::$function"
            (cd "$function" && deno check --frozen . && deno test --frozen --permit-no-files)
            echo "::endgroup::"
          done
