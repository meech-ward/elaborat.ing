name: Deploy Supabase

# Applies supabase/ to the hosted project: Edge Functions, then migrations and
# Vault secrets, then config.toml (Auth, email, storage and API settings).
# See docs/architecture.md, Deploys. Forks skip it until they set the
# SUPABASE_PROJECT_ID variable.
#
# Runs once CI has passed on main, on the commit CI checked (like Deploy app),
# so a failing build never ships half a release; every step is safe to repeat
# (functions redeploy, db push applies only new migrations, config push only
# changes). Also by hand, where pushing config is a choice: config push is not
# atomic, so a diff can be read first.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      push_config:
        description: Push config.toml after showing the diff
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

jobs:
  # Scoped token: Edge Functions Read-write and Connection Pooling Read.
  deploy:
    if: vars.SUPABASE_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ELABORATING_PROJECT_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
      ELABORATING_EMBED_SECRET_KEY: ${{ secrets.EMBED_SECRET_KEY }}
    steps:
      # An unset [db.vault] value is skipped without a word, so check first.
      - name: Check that the secrets are set
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_DEPLOY_TOKEN is not set"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD is not set"; exit 1; }
          test -n "$ELABORATING_EMBED_SECRET_KEY" || { echo "::error::EMBED_SECRET_KEY is not set"; exit 1; }
      - uses: actions/checkout@v5
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      # Functions first, so embed exists before Vault gives the database its key.
      - run: supabase functions deploy --use-api --yes --project-ref "$SUPABASE_PROJECT_ID"
      # No `supabase link`: it needs a token that can read every secret API key.
      # The --project-ref flag makes db push use the IPv4 pooler, since runners
      # have no IPv6. It also writes [db.vault] when it applies a migration.
      - run: supabase db push --yes --project-ref "$SUPABASE_PROJECT_ID"

  # Scoped token: Project Settings and Auth Config Read-write, Add-ons Read, and
  # the config reads. Only this job's environment holds it.
  config:
    needs: deploy
    runs-on: ubuntu-latest
    environment: supabase-config
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_CONFIG_TOKEN }}
      SES_SMTP_USER: ${{ secrets.SES_SMTP_USER }}
      SES_SMTP_PASSWORD: ${{ secrets.SES_SMTP_PASSWORD }}
      # GitHub and Google sign-in: used once [auth.external.*] enabled = true in config.toml.
      SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
    steps:
      # config push leaves out an unset secret (the password) and has no such
      # check for the SMTP user, so an unset one would break sign-in email.
      - name: Check that the secrets are set
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_CONFIG_TOKEN is not set"; exit 1; }
          test -n "$SES_SMTP_USER" || { echo "::error::SES_SMTP_USER is not set"; exit 1; }
          test -n "$SES_SMTP_PASSWORD" || { echo "::error::SES_SMTP_PASSWORD is not set"; exit 1; }
      - uses: actions/checkout@v5
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - run: supabase config diff --project-ref "$SUPABASE_PROJECT_ID"
      # Without --yes, a run with no terminal skips everything and still passes.
      - if: github.event_name == 'workflow_run' || inputs.push_config
        shell: bash
        run: |
          supabase config push --yes --project-ref "$SUPABASE_PROJECT_ID" 2>&1 | tee push.log
          ! grep -q "credential value was not pushed" push.log
      # config push (CLI 2.118.0) does not send [auth.passkey] or [auth.webauthn],
      # so the same values from config.toml go through the Management API.
      - if: github.event_name == 'workflow_run' || inputs.push_config
        name: Push passkey settings
        shell: bash
        run: |
          body=$(python3 - <<'PY'
          import json, tomllib
          c = tomllib.load(open("supabase/config.toml", "rb"))["auth"]
          w = c.get("webauthn", {})
          print(json.dumps({
              "passkey_enabled": bool(c.get("passkey", {}).get("enabled", False)),
              "webauthn_rp_display_name": w.get("rp_display_name"),
              "webauthn_rp_id": w.get("rp_id"),
              "webauthn_rp_origins": ",".join(w.get("rp_origins", [])),
          }))
          PY
          )
          echo "$body"
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data "$body")
          echo "status $status"
          if [ "$status" -ge 300 ]; then cat response.json; exit 1; fi
          python3 -c 'import json; r = json.load(open("response.json")); print({k: r.get(k) for k in ("passkey_enabled", "webauthn_rp_id", "webauthn_rp_origins")})'
