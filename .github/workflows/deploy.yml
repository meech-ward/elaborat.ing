name: Deploy

# Deploys supabase/ to the hosted project and the app to Cloudflare Workers.
# The jobs run in this order, each once the one before it has passed:
#
# 1. supabase: every Edge Function but mcp-server, then migrations and Vault
#    secrets.
# 2. app: the sandbox domain, then the app's Worker (wrangler.jsonc). After the
#    migrations, so new app code never runs before the schema it needs.
# 3. mcp-server: last, because the chat card it sends names files in
#    public/chat-card, which the app's Worker serves.
#
# config pushes config.toml (Auth, email, storage and API settings) after the
# supabase job, beside the app. See docs/architecture.md, Deploys. Forks skip
# it all until they set the SUPABASE_PROJECT_ID variable.
#
# Runs once CI has passed on main, on the newest commit CI has passed there, so
# a failing build never ships half a release and an older commit never
# replaces a newer one; every step is safe to repeat (functions redeploy, db
# push applies only new migrations, config push only changes). Also by hand,
# where pushing config is a choice: config push is not atomic, so a diff can
# be read first.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      push_config:
        description: Push config.toml after showing the diff
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# One deploy at a time. Each one deploys the newest commit CI has passed on
# main, not the commit that triggered it (see the first step).
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

jobs:
  # Scoped token: Edge Functions Read-write and Connection Pooling Read.
  supabase:
    if: vars.SUPABASE_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    # Pinned: ubuntu-latest moves to a new Ubuntu release from 2026-10-19, and a
    # runner image change shouldn't break CI (and so stop deploys) unannounced.
    # Move to a newer image on purpose, with a green run.
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      ELABORATING_PROJECT_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
      ELABORATING_EMBED_SECRET_KEY: ${{ secrets.EMBED_SECRET_KEY }}
    steps:
      # CI runs on main can finish out of order, so the run that triggered
      # this one may be older than the newest green commit. Deploy the newest
      # commit CI has passed on main (the list is newest first, in push order),
      # so whichever deploy runs last ships it and an older commit never
      # replaces a newer one. A hand run deploys it too. The triggering run
      # counts in case the list does not show it yet. Every job deploys the
      # commit found here.
      - name: Find the newest commit CI passed on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" --jq '.workflow_runs[] | "\(.run_number) \(.head_sha)"')
          read -r number sha <<< "$newest"
          if [ -n "$TRIGGER_NUMBER" ] && [ "$TRIGGER_NUMBER" -gt "${number:-0}" ]; then number=$TRIGGER_NUMBER; sha=$TRIGGER_SHA; fi
          test -n "$sha" || { echo "::error::CI has not passed on main yet. Push to main and let CI pass first."; exit 1; }
          echo "::notice::Deploying $sha (CI run $number), the newest commit CI passed on main. Triggered by ${TRIGGER_SHA:-a hand run on $GITHUB_SHA}."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # An unset [db.vault] value is skipped without a word, so check first.
      - name: Check that the secrets are set
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_DEPLOY_TOKEN is not set"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "::error::SUPABASE_DB_PASSWORD is not set"; exit 1; }
          test -n "$ELABORATING_EMBED_SECRET_KEY" || { echo "::error::EMBED_SECRET_KEY is not set"; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.commit.outputs.sha }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      # Functions first, so embed exists before Vault gives the database its key.
      # All but mcp-server, which has its own job. The list is every folder with
      # an index.ts, as the CLI finds functions when given no names, so a new
      # function is never left out.
      - name: Deploy every Edge Function but mcp-server
        run: |
          names=$(printf '%s\n' supabase/functions/*/index.ts | cut -d/ -f3 | grep -vx mcp-server)
          mapfile -t functions <<< "$names"
          supabase functions deploy "${functions[@]}" --use-api --yes --project-ref "$SUPABASE_PROJECT_ID"
      # No `supabase link`: it needs a token that can read every secret API key.
      # The --project-ref flag makes db push use the IPv4 pooler, since runners
      # have no IPv6. It also writes [db.vault] when it applies a migration.
      - run: supabase db push --yes --project-ref "$SUPABASE_PROJECT_ID"

  app:
    needs: supabase
    runs-on: ubuntu-24.04
    env:
      # Public values the build inlines. Supplied here, not committed, so forks
      # never build against the hosted project.
      VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
      # A repository variable, or a repository secret of the same name.
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      # The note frame's sandbox domain (wrangler.sandbox.jsonc). Forks: your
      # own, or empty to keep the frame in the page and skip that deploy.
      VITE_SANDBOX_ORIGIN: https://elaboratingusercontent.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # A fork that hosts the app elsewhere (docs/self-host.md) sets neither
      # Cloudflare secret: this job then deploys nothing and mcp-server still
      # follows it. Setting only one of them is a mistake.
      - name: Check that the settings are there
        id: settings
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets, so the app is hosted elsewhere and this job deploys nothing."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Set SUPABASE_PUBLISHABLE_KEY (the project's publishable key) as a repository variable or repository secret, not an environment one"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      - if: steps.settings.outputs.deploy == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.supabase.outputs.sha }}
      - if: steps.settings.outputs.deploy == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - if: steps.settings.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      - if: steps.settings.outputs.deploy == 'true'
        run: bun run build
      # The sandbox domain first, so the frame page the new app names is
      # there when the app goes live. It keeps the last few frame versions it
      # serves now, for tabs still on an earlier app version.
      - if: steps.settings.outputs.deploy == 'true' && env.VITE_SANDBOX_ORIGIN != ''
        run: bun scripts/keep-frame-versions.ts "$VITE_SANDBOX_ORIGIN"
      - if: steps.settings.outputs.deploy == 'true' && env.VITE_SANDBOX_ORIGIN != ''
        run: bunx wrangler deploy --config wrangler.sandbox.jsonc
      - if: steps.settings.outputs.deploy == 'true'
        run: bunx wrangler deploy

  # The chat card this function sends names the files of its build in
  # public/chat-card, so it goes live only once the app's Worker serves them.
  # The deploy token, as in the supabase job.
  mcp-server:
    needs: [supabase, app]
    runs-on: ubuntu-24.04
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.supabase.outputs.sha }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - run: supabase functions deploy mcp-server --use-api --yes --project-ref "$SUPABASE_PROJECT_ID"

  # Scoped token: Project Settings and Auth Config Read-write, Add-ons Read, and
  # the config reads. Only this job's environment holds it.
  config:
    needs: supabase
    runs-on: ubuntu-24.04
    environment: supabase-config
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_CONFIG_TOKEN }}
      SES_SMTP_USER: ${{ secrets.SES_SMTP_USER }}
      SES_SMTP_PASSWORD: ${{ secrets.SES_SMTP_PASSWORD }}
      # GitHub and Google sign-in: used once [auth.external.*] enabled = true in config.toml.
      SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID }}
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ${{ secrets.SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET }}
    steps:
      # config push leaves out an unset secret (the password) and has no such
      # check for the SMTP user, so an unset one would break sign-in email.
      - name: Check that the secrets are set
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_CONFIG_TOKEN is not set"; exit 1; }
          test -n "$SES_SMTP_USER" || { echo "::error::SES_SMTP_USER is not set"; exit 1; }
          test -n "$SES_SMTP_PASSWORD" || { echo "::error::SES_SMTP_PASSWORD is not set"; exit 1; }
      - uses: actions/checkout@v5
        with:
          # The commit the supabase job deployed.
          ref: ${{ needs.supabase.outputs.sha }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.118.0
      - run: supabase config diff --project-ref "$SUPABASE_PROJECT_ID"
      # Without --yes, a run with no terminal skips everything and still passes.
      - if: github.event_name == 'workflow_run' || inputs.push_config
        shell: bash
        run: |
          supabase config push --yes --project-ref "$SUPABASE_PROJECT_ID" 2>&1 | tee push.log
          ! grep -q "credential value was not pushed" push.log
      # config push (CLI 2.118.0) does not send [auth.passkey] or [auth.webauthn],
      # so the same values from config.toml go through the Management API.
      - if: github.event_name == 'workflow_run' || inputs.push_config
        name: Push passkey settings
        shell: bash
        run: |
          body=$(python3 - <<'PY'
          import json, tomllib
          c = tomllib.load(open("supabase/config.toml", "rb"))["auth"]
          w = c.get("webauthn", {})
          print(json.dumps({
              "passkey_enabled": bool(c.get("passkey", {}).get("enabled", False)),
              "webauthn_rp_display_name": w.get("rp_display_name"),
              "webauthn_rp_id": w.get("rp_id"),
              "webauthn_rp_origins": ",".join(w.get("rp_origins", [])),
          }))
          PY
          )
          echo "$body"
          status=$(curl -sS -o response.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data "$body")
          echo "status $status"
          if [ "$status" -ge 300 ]; then cat response.json; exit 1; fi
          python3 -c 'import json; r = json.load(open("response.json")); print({k: r.get(k) for k in ("passkey_enabled", "webauthn_rp_id", "webauthn_rp_origins")})'
