name: Deploy app

# Builds the app and deploys it to Cloudflare Workers (wrangler.jsonc) once CI
# has passed on main, so only a green build goes live. Forks skip it until they
# set the SUPABASE_PROJECT_ID variable. See docs/architecture.md, Frontend
# hosting.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer commit waits and then goes out last.
concurrency:
  group: app-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.SUPABASE_PROJECT_ID != '' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-latest
    env:
      # Public values the build inlines. Supplied here, not committed, so forks
      # never build against the hosted project.
      VITE_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_ID }}.supabase.co
      # A repository variable, or a repository secret of the same name.
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      # The note frame's sandbox domain (wrangler.sandbox.jsonc). Forks: your
      # own, or empty to keep the frame in the page and skip that deploy.
      VITE_SANDBOX_ORIGIN: https://elaboratingusercontent.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check that the settings are there
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Set SUPABASE_PUBLISHABLE_KEY (the project's publishable key) as a repository variable or repository secret, not an environment one"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
      - uses: actions/checkout@v5
        with:
          # The commit CI passed on, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # The sandbox domain first, so the frame page the new app names is
      # there when the app goes live. It keeps the last few frame versions it
      # serves now, for tabs still on an earlier app version.
      - if: env.VITE_SANDBOX_ORIGIN != ''
        run: bun scripts/keep-frame-versions.ts "$VITE_SANDBOX_ORIGIN"
      - if: env.VITE_SANDBOX_ORIGIN != ''
        run: bunx wrangler deploy --config wrangler.sandbox.jsonc
      - run: bunx wrangler deploy
